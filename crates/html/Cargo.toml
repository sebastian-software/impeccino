[package]
name = "impeccino-html"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Vector dispatcher used by tests/vectors.rs to replay the recorded JS call
# vectors through the Rust port.
vectors = ["impeccino-core/vectors"]

[dependencies]
impeccino-common = { workspace = true }
impeccino-core = { workspace = true }
impeccino-detect = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
regex = { workspace = true }
once_cell = { workspace = true }
indexmap = "2"
scraper = { version = "0.27", default-features = false }
ego-tree = "0.11"
html5ever = "0.39"
selectors = "0.38"
cssparser = "0.37"

[dev-dependencies]
impeccino-core = { workspace = true, features = ["fake-dom", "vectors"] }
impeccino-html = { path = ".", features = ["vectors"] }
