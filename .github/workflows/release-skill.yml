name: release-skill
on:
  workflow_dispatch:
    inputs:
      engine_tag:
        description: 'Published engine tag to prepare a skill pin PR for'
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: release-skill
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify and prepare the shared skill version
        env:
          ENGINE_TAG: ${{ inputs.engine_tag }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/product-release.mjs prepare-skill "$ENGINE_TAG"
      - name: Validate the prepared skill
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run test:skill-behavior
      - name: Open the skill pin PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: node scripts/skill-pin-pr.mjs
  publish:
    # Never consume fork/PR runs, their code, caches, or artifacts with write access.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Require the tested main commit and complete shared pins
        id: candidate
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/skill-pin-pr.mjs candidate "$TESTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Reverify the published engine and committed pins
        if: steps.candidate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat .release-please-version)
          node scripts/product-release.mjs prepare-skill "engine-v${version}"
          git diff --exit-code -- skill/SKILL.md skill/scripts/VERSION skill/scripts/engine.sha256
      - name: Publish the skill with the tested shared version
        if: steps.candidate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs skill --resume
