name: release-engine
# Builds the engine binary for every supported target and publishes them as
# the GitHub Release `engine-v<X>` on this repo. That
# release is what the launcher (skill/scripts/impeccino) and
# `bun run fetch:engine` download. Binaries are not code-signed; a GitHub
# build attestation binds each one to this repo and workflow (verify with
# `gh attestation verify <file> -R <repo>`). The release is published only
# once every asset is attached, so it works with immutable releases;
# scripts/pin-engine.mjs then pins the digests into the skill.
#
# Trigger: `bun run release:engine` (scripts/release.mjs) verifies
# skill/scripts/VERSION and a clean tree, then pushes the tag. Third-party actions are pinned to commit SHAs so a
# moved tag cannot swap the code this workflow runs.
on:
  push:
    tags: ['engine-v*']
# Same-run artifact transfers use ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN;
# they do not require actions: read/write. Keep downloads scoped to this run.
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       target: aarch64-apple-darwin,       short: darwin-arm64 }
          # No Intel runner: GitHub retired macos-13. Apple's toolchain builds
          # x86_64 on an arm64 host natively once the target is installed.
          - { os: macos-14,       target: x86_64-apple-darwin,        short: darwin-x64 }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  short: linux-x64 }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, short: linux-arm64, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     short: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches skill/scripts/VERSION
        shell: bash
        run: |
          set -e
          want="engine-v$(tr -d '[:space:]' < skill/scripts/VERSION)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME != $want"; exit 1; }
      # rust-toolchain.toml names the channel; `rustup show` installs it.
      # Never override the toolchain here.
      - name: Install the pinned toolchain
        shell: bash
        run: rustup show && rustup target add ${{ matrix.target }}
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release -p impeccino --target ${{ matrix.target }}
      - name: Smoke the binary
        if: ${{ !matrix.cross }}
        shell: bash
        run: target/${{ matrix.target }}/release/impeccino${{ runner.os == 'Windows' && '.exe' || '' }} engine-probe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impeccino-${{ matrix.short }}
          path: target/${{ matrix.target }}/release/impeccino${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: the OIDC token signs the attestation, which GitHub stores.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: impeccino-*
          path: artifacts
      - name: Lay out release assets
        run: |
          set -e
          mkdir -p out
          for d in artifacts/impeccino-*; do
            short=$(basename "$d" | sed 's/^impeccino-//')
            f=$(ls "$d" | head -1)
            case "$short" in windows-*) dest="out/impeccino-$short.exe" ;; *) dest="out/impeccino-$short" ;; esac
            cp "$d/$f" "$dest"
          done
          ls -la out
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/impeccino-*
      - name: Publish the GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        # Draft first, attach every asset, then publish: an immutable release
        # locks its assets at publication. No --clobber and no upload into an
        # existing release; a re-run against a published release fails.
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "impeccino engine $tag" \
            --notes "Prebuilt impeccino engine binaries ($tag). The skill's launcher downloads these on first run and checks them against the digests pinned in skill/scripts/engine.sha256. Verify provenance with: gh attestation verify <file> -R $GITHUB_REPOSITORY" out/*
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
