name: release-engine
# Release Please creates the draft and tag. Dispatch on engine-v<version>,
# never main; recovery uses the same tagged workflow and immutable sources.
on:
  workflow_dispatch:
concurrency:
  group: release-engine-${{ github.ref }}
  cancel-in-progress: false
# Same-run artifact transfers use ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN;
# they do not require actions: read/write. Keep downloads scoped to this run.
permissions:
  contents: read
jobs:
  release-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # GitHub exposes draft releases only to callers with push access.
    permissions:
      contents: write
    outputs:
      draft: ${{ steps.release.outputs.draft }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the product tag
        run: node scripts/product-release.mjs check-tag "$GITHUB_REF_NAME"
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')
          case "$draft" in true|false) ;; *) exit 1 ;; esac
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
  build:
    needs: release-state
    if: needs.release-state.outputs.draft == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin,       short: darwin-arm64 }
          # No Intel runner: GitHub retired macos-13. Apple's toolchain builds
          # x86_64 on an arm64 host natively once the target is installed.
          - { os: macos-latest,   target: x86_64-apple-darwin,        short: darwin-x64 }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  short: linux-x64 }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, short: linux-arm64, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     short: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches the product version
        shell: bash
        run: node scripts/product-release.mjs check-tag "$GITHUB_REF_NAME"
      # rust-toolchain.toml names the channel; `rustup show` installs it.
      # Never override the toolchain here.
      - name: Install the pinned toolchain
        shell: bash
        run: rustup show && rustup target add ${{ matrix.target }}
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.cross
        name: Install pinned cross
        run: cargo install cross --locked --version 0.2.5
      - name: Build
        shell: bash
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --locked --release -p impeccino --target ${{ matrix.target }}
      - name: Smoke the binary
        if: ${{ !matrix.cross }}
        shell: bash
        run: target/${{ matrix.target }}/release/impeccino${{ runner.os == 'Windows' && '.exe' || '' }} engine-probe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impeccino-${{ matrix.short }}
          path: target/${{ matrix.target }}/release/impeccino${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
  smoke-linux-arm64:
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: impeccino-linux-arm64
          path: artifact
      - name: Run the exact linux-arm64 release artifact
        run: |
          set -euo pipefail
          chmod +x artifact/impeccino
          test -x artifact/impeccino
          artifact/impeccino --version
          artifact/impeccino engine-probe
  publish:
    timeout-minutes: 20
    needs: [build, smoke-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: the OIDC token signs the attestation, which GitHub stores.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: impeccino-*
          path: artifacts
      - name: Lay out release assets
        run: |
          set -e
          mkdir -p out
          for d in artifacts/impeccino-*; do
            short=$(basename "$d" | sed 's/^impeccino-//')
            f=$(ls "$d" | head -1)
            case "$short" in windows-*) dest="out/impeccino-$short.exe" ;; *) dest="out/impeccino-$short" ;; esac
            cp "$d/$f" "$dest"
          done
          ls -la out
      # The release notice is derived from the same locked graph used by every
      # target build. Fetch all target-specific crate sources before asking
      # cargo-about to run offline in frozen mode.
      - name: Install the pinned toolchain
        run: rustup show
      - name: Fetch locked release dependencies
        run: cargo fetch --locked
      - name: Install pinned cargo-about
        run: cargo install --locked --version 0.8.4 cargo-about
      - name: Generate engine third-party notices
        run: node scripts/generate-engine-notices.mjs out/THIRD-PARTY-NOTICES.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/impeccino-*
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-engine.mjs "$GITHUB_REF_NAME" out
  pin-skill:
    needs: [release-state, publish]
    if: ${{ always() && needs.release-state.result == 'success' && (needs.publish.result == 'success' || needs.release-state.outputs.draft == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # Skill preparation follows main so recovery can fix delivery without
      # moving the immutable engine tag or rebuilding published binaries.
      - name: Prepare a CI-checked skill pin PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release-skill.yml --ref main -f engine_tag="$GITHUB_REF_NAME"
