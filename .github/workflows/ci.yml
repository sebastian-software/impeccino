name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skill_workflow:
        description: 'Run billed, browser-backed Claude workflow completion tests'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Scheduled runs get their own group: the 07:00 UTC nightly and a push to
  # main share github.ref, and cancel-in-progress would let them kill each
  # other mid-run.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.plan.outputs.core }}
      oracle: ${{ steps.plan.outputs.oracle }}
      rust: ${{ steps.plan.outputs.rust }}
      skill_behavior: ${{ steps.plan.outputs.skill_behavior }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Detect test plan
        id: plan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/ci-test-plan.mjs

  test-matrix:
    name: test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install

      - name: Run core tests
        run: bun run test:core

      - name: Repository checks
        run: bun run check

  # The Rust workspace: the engine binary, the rule core, and every crate
  # behind them. Everything builds from source with no downloads.
  rust:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml names the channel; `rustup show` installs it.
      # Never override the toolchain here.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  # The engine ships a windows-x64 binary (release-engine.yml), so the
  # workspace has to build and pass its own tests there. Tests that need a
  # browser or the oracle skip when those are absent.
  rust-windows:
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --no-fail-fast

  launcher-windows:
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.core == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Exercise Windows launcher downloads and verification
        run: node --test tests/launcher-download.test.mjs

  # Behavior gate: replays the tests/oracle/ goldens against a release build
  # of the engine from THIS checkout (so a PR is judged on its own source,
  # not on the last published binary). Without this job the oracle only ever
  # runs on developer laptops: tests/oracle.test.mjs skips cleanly when no
  # binary is present, so the default suite is silent about it on CI.
  oracle:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.oracle == 'true' || needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the engine from source
        run: cargo build --release -p impeccino

      - name: Replay oracle goldens
        env:
          IMPECCINO_BIN: ${{ github.workspace }}/target/release/impeccino
        run: node tests/oracle/run.mjs

  # Release-order guard: the engine release for the pinned skill/scripts/VERSION
  # (five binaries) and its pins in skill/scripts/engine.sha256 must exist before a skill release or a merge that
  # bumps the pin, or the launcher dead-ends. release.mjs hard-fails
  # `release:skill` on the same check.
  engine-release-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check engine release assets for the pinned engine version
        id: check
        run: node scripts/check-engine-release.mjs

      - name: Check the skill pins that engine release
        run: node scripts/pin-engine.mjs --check

      - name: Annotate missing engine release
        # Only when the check itself failed, so a checkout or setup failure keeps its own error.
        if: failure() && steps.check.outcome == 'failure'
        run: |
          echo "::error title=Engine release not ready::The engine release for v$(cat skill/scripts/VERSION) is not fully published (engine-v$(cat skill/scripts/VERSION) release assets). Publish the engine (bun run release:engine) before bumping skill/scripts/VERSION or releasing the skill."

  test:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    steps:
      - name: Verify Node test matrix
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "test-matrix result: ${{ needs.test-matrix.result }}"
            exit 1
          fi
          echo "test matrix passed"

  skill-behavior:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.skill_behavior == 'true' && github.event_name != 'pull_request'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install

      - name: Prepare engine for protocol tests
        run: bun run fetch:engine

      - name: Run skill behavior tests
        run: bun run test:skill-behavior

  skill-workflow:
    # Expensive, manually opted-in completion diagnostics. This does not
    # replace the multi-family skill-behavior protocol suite above.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.skill_workflow
    timeout-minutes: 70
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IMPECCINO_SKILL_BEHAVIOR_MODELS: claude-sonnet-5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare engine and browser before billing
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo 'ANTHROPIC_API_KEY is required'; exit 1; }
          bun run fetch:engine
          bunx playwright install --with-deps chromium
      - name: Run completed skill workflows
        env:
          IMPECCINO_SKILL_BEHAVIOR_TRACE_DIR: ${{ runner.temp }}/skill-workflow-traces
        run: bun run test:skill-workflow
      - name: Retain diagnostic traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-workflow-traces
          path: ${{ runner.temp }}/skill-workflow-traces
          retention-days: 7
