name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skill_behavior:
        description: 'Run billed, provider-backed skill behavior checks'
        type: boolean
        default: false
      skill_workflow:
        description: 'Run billed, browser-backed Claude workflow completion tests'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.plan.outputs.core }}
      oracle: ${{ steps.plan.outputs.oracle }}
      rust: ${{ steps.plan.outputs.rust }}
      skill_behavior: ${{ steps.plan.outputs.skill_behavior }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Detect test plan
        id: plan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_INPUTS_SKILL_BEHAVIOR: ${{ inputs.skill_behavior }}
        run: node scripts/ci-test-plan.mjs

  test-matrix:
    name: test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run core tests
        run: pnpm run test:core

      - name: Repository checks
        run: pnpm run check

  # The Rust workspace: the engine binary, the rule core, and every crate
  # behind them. Everything builds from source with no downloads.
  rust:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml names the channel; `rustup show` installs it.
      # Never override the toolchain here.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  # The engine ships a windows-x64 binary (release-engine.yml), so the
  # workspace has to build and pass its own tests there. Tests that need a
  # browser or the oracle skip when those are absent.
  rust-windows:
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --no-fail-fast

  engine-notices:
    name: Generate engine third-party notices
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show
      - name: Fetch locked release dependencies
        run: cargo fetch --locked
      - name: Install pinned cargo-about
        run: cargo install --locked --version 0.8.4 cargo-about
      - name: Generate and validate target-union notices
        run: node scripts/generate-engine-notices.mjs "$RUNNER_TEMP/THIRD-PARTY-NOTICES.txt"

  launcher-windows:
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.core == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exercise Windows launcher downloads and verification
        run: pnpm exec vitest run tests/launcher-download.test.mjs

  # Behavior gate: replays the tests/oracle/ goldens against a release build
  # of the engine from THIS checkout (so a PR is judged on its own source,
  # not on the last published binary). Without this job the oracle only ever
  # runs on developer laptops: tests/oracle.test.mjs skips cleanly when no
  # binary is present, so the default suite is silent about it on CI.
  oracle:
    name: oracle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.oracle == 'true' || needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tests/oracle/run.mjs needs Node only, no dependencies.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the engine from source
        run: cargo build --release -p impeccino

      - name: Replay oracle goldens
        env:
          IMPECCINO_BIN: ${{ github.workspace }}/target/release/impeccino${{ matrix.os == 'windows-latest' && '.exe' || '' }}
        run: node tests/oracle/run.mjs

  # Release-order guard: the engine release for the pinned skill/scripts/VERSION
  # (five binaries) and its pins in skill/scripts/engine.sha256 must exist before a skill release or a merge that
  # bumps the pin, or the launcher dead-ends. Release candidates keep the old
  # installed pin until the new engine has been published and verified.
  engine-release-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check engine release assets for the pinned engine version
        id: check
        shell: bash
        run: |
          if node scripts/check-engine-release.mjs; then
            exit 0
          else
            status=$?
          fi
          if [ "$status" -eq 2 ]; then
            echo "::warning title=Engine release check unavailable::GitHub release assets could not be verified after retries. Rerun this check before changing the engine pin or releasing the skill."
            exit 0
          fi
          exit "$status"

      - name: Check the candidate product version
        run: node scripts/product-release.mjs check-tag "engine-v$(cat .release-please-version)"

      - name: Check the skill pins that engine release
        run: node scripts/pin-engine.mjs --check

      - name: Annotate missing engine release
        # Only when the check itself failed, so a checkout or setup failure keeps its own error.
        if: failure() && steps.check.outcome == 'failure'
        run: |
          echo "::error title=Engine release not ready::The engine release for v$(cat skill/scripts/VERSION) is not fully published. Resume release-engine.yml on its engine-v tag before advancing the installed skill pin."

  test:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    steps:
      - name: Verify Node test matrix
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "test-matrix result: ${{ needs.test-matrix.result }}"
            exit 1
          fi
          echo "test matrix passed"

  skill-behavior:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.skill_behavior
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_CLOUD_API_KEY: ${{ secrets.GOOGLE_CLOUD_API_KEY }}
      IMPECCINO_SKILL_BEHAVIOR_REQUIRE_PROVIDER: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare engine for protocol tests
        run: pnpm run fetch:engine

      - name: Run skill behavior tests
        run: pnpm run test:skill-behavior

  skill-workflow:
    # Expensive, manually opted-in completion diagnostics. This does not
    # replace the multi-family skill-behavior protocol suite above.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.skill_workflow
    timeout-minutes: 70
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IMPECCINO_SKILL_BEHAVIOR_MODELS: claude-sonnet-5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare engine and browser before billing
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo 'ANTHROPIC_API_KEY is required'; exit 1; }
          pnpm run fetch:engine
          pnpm exec playwright install --with-deps chromium
      - name: Run completed skill workflows
        env:
          IMPECCINO_SKILL_BEHAVIOR_TRACE_DIR: ${{ runner.temp }}/skill-workflow-traces
        run: pnpm run test:skill-workflow
      - name: Retain diagnostic traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-workflow-traces
          path: ${{ runner.temp }}/skill-workflow-traces
          retention-days: 7
