# The impeccino runtime: one Cargo workspace next to the skill it powers.
# `cargo build --release -p impeccino` produces the engine binary the launcher
# (skill/scripts/impeccino) runs. See docs/ENGINE.md.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
impeccino-foundation = { path = "crates/foundation" }
impeccino-common = { path = "crates/common" }
impeccino-core = { path = "crates/core" }
impeccino-detect = { path = "crates/detect" }
impeccino-html = { path = "crates/html" }
impeccino-context = { path = "crates/context" }
impeccino-hook = { path = "crates/hook" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
regex = "1"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
